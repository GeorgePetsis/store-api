spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommercedb
    username: $(POSTGRES_USER:postgres)
    password: $(POSTGRES_PASSWORD:postgrespassword)
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  properties:
    hibernate:
      format_sql: true

